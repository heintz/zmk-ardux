name: Validate ARTSEY port

on: [push, pull_request, workflow_dispatch]

jobs:
  behavior:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            bootloader/
            modules/
            tools/
            zephyr/
            zmk/
          key: ${{ runner.os }}-build-cache-zephyr-modules-${{ hashFiles('config/west.yml') }}
      - run: west init -l config
      - run: west update
      - run: west zephyr-export
      - name: Exercise beta and legacy keymaps in native ZMK
        run: python3 tests/test_artsey.py zmk/app
      - name: Save HID event logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artsey-behavior-logs
          path: |
            test-*.log
            tests/test_artsey.py
            config/boards/shields/the_paintbrush/the_paintbrush_left.keymap
